name: WeeWX compatibility

on:
  schedule:
    - cron: '23 4 * * 1'
    - cron: '23 4 * * 2'
    - cron: '23 4 * * 3'
    - cron: '23 4 * * 4'
    - cron: '23 4 * * 5'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ci/upstream-state.json
      - ci/source-quality.json
      - ci/wiki-state.json
  pull_request:

permissions:
  contents: read

# Serialize reports so an older result cannot close a newer failure.
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Synchronize the WeeWX fork
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_SSH_KEY: ${{ secrets.WEEWX_MIRROR_SSH_KEY }}
        run: |
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$MIRROR_SSH_KEY" > "$key_dir/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$key_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$key_dir/known_hosts"
          bash ci/sync-weewx.sh https://github.com/weewx/weewx.git git@github.com:weewx-packages/weewx.git

  prepare:
    needs: mirror
    if: ${{ !cancelled() && (needs.mirror.result == 'success' || needs.mirror.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest packaging jsonschema
      - run: python -m pytest -q ci/tests
      - run: python ci/upstreams.py readme --check
      - name: Validate catalog structure
        run: |
          python - <<'PY'
          import json
          import jsonschema
          from pathlib import Path
          jsonschema.validate(json.loads(Path('repository.json').read_text()),
                              json.loads(Path('schemas/repository-v1.schema.json').read_text()))
          PY
      - name: Verify coverage of every tracked project
        run: python ci/project_coverage.py > coverage.json
      - name: Resolve release tests and mirrored WeeWX commits
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python ci/compatibility.py matrix --weekday "${TEST_SCHEDULE##* }" > matrix.json
          else
            python ci/compatibility.py matrix > matrix.json
          fi
          echo "matrix=$(python ci/compatibility.py shards --plan matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan
          path: |
            matrix.json
            coverage.json
          retention-days: 30

  test:
    needs: prepare
    # PRs skip the mirror. Override implicit success() so that skipped ancestor
    # cannot suppress the matrix after preparation has succeeded.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      # Two groups at a time with max-parallel 8 in compatibility-group.yml run
      # at most 16 jobs. The free plan allows 20 concurrent jobs for the whole
      # organization, which leaves 4 for the tests of package pull requests.
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Group ${{ matrix.group }}
    uses: ./.github/workflows/compatibility-group.yml
    with:
      matrix: ${{ toJSON(matrix.cases) }}

  report:
    needs: [prepare, test]
    if: ${{ always() && needs.prepare.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # This job executes catalog code only. Extension installers and tests
      # never receive a token that can create or change issues.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: reports
      - name: Summarize results and maintain package issues
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_ISSUES: 'true'
        run: python ci/issues.py reports
