name: WeeWX compatibility

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Serialize reports so an older result cannot close a newer failure.
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest packaging jsonschema
      - run: python -m pytest -q ci/tests
      - name: Validate catalog structure
        run: |
          python - <<'PY'
          import json
          import jsonschema
          from pathlib import Path
          jsonschema.validate(json.loads(Path('repository.json').read_text()),
                              json.loads(Path('schemas/repository-v1.schema.json').read_text()))
          PY
      - name: Resolve release tests and upstream commits
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ci/compatibility.py matrix > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan
          path: matrix.json
          retention-days: 30

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.package }} / ${{ matrix.branch }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: catalog
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: weewx/weewx
          ref: ${{ matrix.weewx_sha }}
          path: weewx
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source_sha }}
          path: extension
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli
          php --version
          python -m pip install ./weewx pytest packaging
      - name: Install and test the release archive
        env:
          CASE_JSON: ${{ toJSON(matrix) }}
        run: python catalog/ci/compatibility.py run --source extension --work result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: result-${{ matrix.package }}-${{ matrix.branch }}-${{ matrix.python }}
          path: |
            result/result.json
            result/junit.xml
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: [prepare, test]
    if: ${{ always() && needs.prepare.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # This job executes catalog code only. Extension installers and tests
      # never receive a token that can create or change issues.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: reports
      - name: Summarize results and maintain package issues
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_ISSUES: 'true'
        run: python ci/issues.py reports
