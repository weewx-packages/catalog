name: Compatibility group

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    name: ${{ matrix.package }} / ${{ matrix.branch }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: catalog
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.weewx_repository }}
          ref: ${{ matrix.weewx_sha }}
          path: weewx
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source_sha }}
          path: extension
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plan
          path: plan
      - name: Install test dependencies
        run: |
          python -m pip install packaging
          python catalog/ci/compatibility.py system --plan plan/matrix.json --case-id "${{ matrix.case_id }}"
          python -m pip install ./weewx pytest packaging requests skyfield "pymodbus>=3.11,<4" pyserial
      - name: Install and test the release archive
        run: python catalog/ci/compatibility.py run --plan plan/matrix.json --case-id "${{ matrix.case_id }}" --source extension --work result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: result-${{ matrix.package }}-${{ matrix.branch }}-${{ matrix.python }}
          path: |
            result/result.json
            result/junit.xml
          if-no-files-found: warn
          retention-days: 30

